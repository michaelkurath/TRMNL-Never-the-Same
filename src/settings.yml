---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.6
serverless_language: ''
refresh_interval_floor: ''
polling_url: https://{{ api_host }}/v1/artwork?zone={{ trmnl.user.time_zone_iana | url_encode }}&cadence={{ cadence | url_encode }}&style={{ art_style | url_encode }}&palette={{ palette | url_encode }}&density={{ density | url_encode }}&seed={{ edition_seed | url_encode }}
polling_headers: ''
polling_body: ''
id: 543559
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: about
  name: About Never the Same
  field_type: author_bio
  category: art,images
  github_url: https://github.com/michaelkurath/TRMNL-Never-the-Same
  description: "<p>Never the Same turns your TRMNL into a rotating gallery of generative abstract art. Orbital Geometry plays with rings and intersecting shapes, Constructivist arranges bold geometric forms, and Strata builds compositions from layered contours. The artwork is composed separately for landscape and portrait on TRMNL Frame.</p> <p>Choose a style or let Rotating Gallery cycle through all three. Pick a palette, including Ink for monochrome, and choose Balanced or Layered detail. A new edition is generated daily or each Monday in your local time zone. Refreshing with the same settings during an edition keeps the same composition. An optional personal seed gives you a reproducible variation.</p> <p>To connect the recipe, enter the hostname of a running artwork API. You can use <code>never-the-same-artwork.onrender.com</code> or deploy your own from the GitHub repository.</p>"
- keyname: api_host
  name: Artwork API hostname
  field_type: string
  description: Enter the hostname of your deployed artwork API, without https:// or a path.
  placeholder: artwork.example.com
- keyname: cadence
  name: New artwork
  field_type: select
  default: daily
  options:
  - Daily
  - Weekly
- keyname: art_style
  name: Composition style
  field_type: select
  default: rotating_gallery
  options:
  - Rotating Gallery
  - Orbital Geometry
  - Constructivist
  - Strata
- keyname: palette
  name: Palette
  field_type: select
  default: rotating_palette
  options:
  - Rotating Palette
  - Poster
  - Coast
  - Orchard
  - Ink
- keyname: density
  name: Density
  field_type: select
  default: balanced
  options:
  - Balanced
  - Layered
- keyname: edition_seed
  name: Personal seed
  field_type: string
  optional: true
  maxlength: 64
  description: Use the same seed on different devices to match their daily or weekly editions.
name: Never the Same
description: Generative art, daily or weekly
refresh_interval: 60
